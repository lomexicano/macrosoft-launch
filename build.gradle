plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

application {
    mainClass = 'net.minecraft.launcher.Main'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven {
        name = "mojang"
        url = "https://libraries.minecraft.net/"
    }
}

dependencies {
    implementation group: 'net.lingala.zip4j', name: 'zip4j', version: '2.6.1'
    implementation group: 'org.json', name: 'json', version: '20160810'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.3.1'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.0'
    implementation group: 'com.google.guava', name: 'guava', version: '18.0'

    implementation group: 'net.sf.jopt-simple', name: 'jopt-simple', version: '4.8'

    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.3.2'
    implementation group: 'commons-io', name: 'commons-io', version: '2.4'
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.10'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.5'
}

shadowJar {
    exclude '**/Log4j2Plugins.dat'
    manifest {
        attributes(
            'Main-Class':               'net.minecraft.launcher.Main',
            'Premain-Class':            'net.minecraft.launcher.utils.SocksAuthenticatorAgent',
            'Can-Redefine-Classes':     'false',
            'Can-Retransform-Classes':  'false'
        )
    }
}